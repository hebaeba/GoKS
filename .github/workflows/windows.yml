name: Windows test build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Frontend and backend checks
        shell: pwsh
        run: |
          node --test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path backend-rs/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path lan-server/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows application
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Collect Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: kifu-editor-windows-test
          path: dist/*
          if-no-files-found: error
