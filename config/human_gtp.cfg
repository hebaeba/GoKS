# KataGo GTP config: human-like amateur 1 dan
# Based on the official gtp_human5k_example.cfg, with rank_1d.
# Needs BOTH a normal KataGo neural network (-model) and the Human SL
# network (-human-model b18c384nbt-humanv0.bin.gz).
# Source: https://github.com/lightvector/KataGo/blob/master/cpp/configs/gtp_human5k_example.cfg

# General GTP setup
logDir = gtp_logs
logAllGTPCommunication = false
logSearchInfo = false
logSearchInfoForChosenMove = false
logToStderr = false
rules = japanese

# GoKS-v1.1 resignation compatibility:
# GoKS overrides resignThreshold, resignConsecTurns, allowResignation,
# and the minimum move restriction during an even-game match.
# The old cfg's resignMinScoreDifference = 40 was NOT overridden,
# so it prevented resignation despite three successive very low win rates.
# Remove that extra 40-point hurdle while preserving Human SL play.
allowResignation = true
resignThreshold = -0.94
resignConsecTurns = 3
resignMinScoreDifference = 0
resignMinMovesPerBoardArea = 0.0

# Search visits are mainly used to decide when to pass or resign.
# With the settings below, they do not normally strengthen the chosen move.
maxVisits = 40
numSearchThreads = 1
lagBuffer = 1.0

# Human-like move selection. Change rank_1d to e.g. rank_2k or rank_2d.
humanSLProfile = rank_1d
humanSLChosenMoveProp = 1.0
humanSLChosenMoveIgnorePass = true
humanSLChosenMovePiklLambda = 100000000

# Disable mixing the human policy into the normal tree search.
humanSLRootExploreProbWeightless = 0.0
humanSLRootExploreProbWeightful = 0.0
humanSLPlaExploreProbWeightless = 0.0
humanSLPlaExploreProbWeightful = 0.0
humanSLOppExploreProbWeightless = 0.0
humanSLOppExploreProbWeightful = 0.0

# Sample moves from a rank-appropriate human policy.
chosenMoveTemperatureEarly = 0.85
chosenMoveTemperature = 0.70
chosenMoveTemperatureHalflife = 80
chosenMoveTemperatureOnlyBelowProb = 0.01
chosenMoveSubtract = 0
chosenMovePrune = 0

# Human imitation works better when previous moves are considered.
ignorePreRootHistory = false
analysisIgnorePreRootHistory = false
rootNumSymmetriesToSample = 2
useLcbForSelection = false

# Match official human-play example's score utility/search settings.
winLossUtilityFactor = 1.0
staticScoreUtilityFactor = 0.30
dynamicScoreUtilityFactor = 0.00
useUncertainty = false
subtreeValueBiasFactor = 0.0
useNoisePruning = false
nnCacheSizePowerOfTwo = 17
nnMutexPoolSizePowerOfTwo = 14
