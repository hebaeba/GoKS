<html lang="ja">
<head><script defer src="appearance-core.js?v=121"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Go棋譜Studio</title><link rel="stylesheet" href="style.css?v=121"><script defer src="engine.js?v=121"></script><script defer src="sgf.js?v=121"></script><script defer src="export.js?v=121"></script><script defer src="import.js?v=121"></script><script defer src="score.js?v=121"></script><script defer src="dialogs.js?v=121"></script><script defer src="record-state.js?v=121"></script><script defer src="interaction.js?v=121"></script><script defer src="auxiliary.js?v=124"></script><script defer src="app.js?v=121"></script><link rel="stylesheet" href="workspace.css?v=121"><script defer src="workspace.js?v=121"></script><link rel="stylesheet" href="analysis.css?v=121"><script defer src="analysis-core.js?v=121"></script><script defer src="desktop.js?v=121"></script><script defer src="gtp.js?v=121"></script><script defer src="engine-args.js?v=121"></script><script defer src="side-evaluation.js?v=121"></script><link rel="stylesheet" href="side-evaluation.css?v=121"><script defer src="ranking-fold.js?v=121"></script><script defer src="analysis.js?v=124"></script><link rel="stylesheet" href="studio.css?v=121"><script defer src="studio.js?v=121"></script><link rel="stylesheet" href="compact.css?v=121"><script defer src="compact.js?v=121"></script><link rel="stylesheet" href="refine.css?v=121"><script defer src="refine.js?v=123"></script><script defer src="image-board-core.js?v=121"></script><script defer src="image-board.js?v=121"></script><link rel="stylesheet" href="image-board.css?v=121"><script defer src="match-core.js?v=121"></script><script defer src="clock-core.js?v=121"></script><script defer src="match-clock-window.js?v=121"></script><script defer src="match.js?v=121"></script><script defer src="match-ranking.js?v=121"></script><link rel="stylesheet" href="match.css?v=121"><link rel="stylesheet" href="layout60.css?v=121"><script defer src="layout60.js?v=121"></script><link rel="stylesheet" href="simple.css?v=121"><link rel="stylesheet" href="sidebar.css?v=121"><link rel="stylesheet" href="ui-policy.css?v=121"><link rel="stylesheet" href="fields.css?v=124"><script defer src="fields.js?v=121"></script><script defer src="sidebar.js?v=121"></script><script defer src="panel-window.js?v=121"></script><script defer src="simple-window-menu.js?v=124"></script><script defer src="estimate-core.js?v=121"></script><script defer src="estimate.js?v=124"></script><link rel="stylesheet" href="i18n.css?v=121"><script defer src="i18n-en.js?v=124"></script><script defer src="i18n.js?v=121"></script><link rel="stylesheet" href="appearance.css?v=121"><script defer src="appearance.js?v=121"></script></head>
<body data-standalone><main>
<header><span class="eyebrow">INDEPENDENT GO · EDITOR 0.5</span><h1>碁盤編集ツール</h1><p>EidoGoに依存しない、独立実装の編集版</p></header>
<div class="workspace"><section class="board-panel" aria-label="碁盤">
<div class="topline"><label>碁盤 <select id="size" aria-label="新しい碁盤の路数"></select></label><button id="new">新しい碁盤</button><div class="modes" role="group" aria-label="操作モード"><button id="view" aria-pressed="false" title="棋譜を変更せず閲覧します">閲覧</button><button id="edit" aria-pressed="true" title="石を打って棋譜を編集します">編集</button></div></div>
<div class="canvas-wrap"><canvas id="board" tabindex="0" role="application" aria-label="囲碁の碁盤。矢印キーで交点を選び、Enterで着手。閲覧中は石を押すとその手へ移動。"></canvas></div>
<div class="players"><span id="black-name" title="黒番">黒番</span><span class="stones"><i id="black-turn" aria-label="黒石"></i><small>vs</small><i id="white-turn" aria-label="白石"></i></span><span id="white-name" title="白番">白番</span></div>
<div class="statusline"><span id="komi">コミ0</span><span id="captures">アゲハマ 黒0・白0</span><strong id="move">手数0手</strong></div>
<div class="controls"><div class="navigation" role="group" aria-label="手順移動"><button id="first" title="最初の局面へ" aria-label="最初の局面">|◀</button><button id="back10" title="10手戻る" aria-label="10手戻る">◀◀</button><button id="back" title="1手戻る" aria-label="1手戻る">◀</button><button id="next" title="1手進む" aria-label="1手進む">▶</button><button id="next10" title="10手進む" aria-label="10手進む">▶▶</button><button id="last" title="選択した手順の最後へ" aria-label="最後の局面">▶|</button></div>
<div class="actions"><button id="numbers" aria-pressed="false" title="盤上の石に着手番号を表示します">手数の表示</button><span class="recent-label"><label><input id="recent" type="checkbox">直近</label><select id="recent-count" aria-label="直近の表示手数" title="表示・印刷する直近の手数"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="5" selected>5</option><option value="10">10</option><option value="20">20</option><option value="30">30</option><option value="50">50</option><option value="custom">指定</option></select><input id="recent-custom" type="number" min="1" max="9999" step="1" value="5" aria-label="直近の指定手数" hidden>手</span><button id="pass" title="パスを1手として記録します">パス</button><button id="delete-move" title="表示中の局面と、その先の手順を削除します">削除</button><label class="jump">指定手数 <input id="jump" type="number" min="0" step="1" value="0" aria-label="移動先の手数"> <button id="jump-go" title="入力した手数へ移動します">移動</button></label></div>
<label class="slider-label" for="slider">手順 <input id="slider" type="range" min="0" max="0" value="0" aria-label="局面を移動"></label>
<div id="branches" hidden><label>この局面からの手順 <select id="branch" aria-label="この局面からの手順を選択"></select></label></div></div>
<section class="edit-panel" aria-label="編集機能"><div class="edit-buttons"><button id="undo" title="直前の編集を取り消します">取り消し</button><button id="redo" title="取り消した編集をやり直します">やり直し</button><button id="insert" title="直近の手に続いて挿入します">ここへ挿入</button><button id="cancel-insert" hidden title="今回の挿入をすべて中止し元の棋譜へ戻します">挿入を中止</button></div>
<div class="variation-actions"><button id="mainline" title="最初の子をたどる本譜へ戻ります">本譜へ戻る</button><button id="promote" title="選択している変化を本譜にします。元の本譜も残します">この変化を本譜に</button><button id="delete-branch" title="選択中の変化とその先の分岐を削除します">この変化を削除</button></div><p id="route-info" class="muted"></p>
<details id="tools"><summary>ツール・文章の編集</summary><label>盤上の操作 <select id="tool"><option value="play">着手</option><option value="AB">黒石を配置</option><option value="AW">白石を配置</option><option value="AE">石を取り除く</option><option value="TR">三角</option><option value="SQ">四角</option><option value="CR">丸</option><option value="MA">バツ</option><option value="upper">英大文字</option><option value="lower">英小文字</option><option value="number">数字</option><option value="label">文章入力</option><option value="DD">網掛け</option><option value="clear">記号・文字・網掛けを消す</option></select></label><label id="label-row" hidden>文字 <input id="label-text" maxlength="80" value="A" aria-label="盤上に配置する文章"></label><p class="muted">交点を押して配置します。同じ記号はもう一度押すと消えます。配置石は手数に数えません。</p><button id="turn" title="現在の局面の次の手番を切り替えます">手番切り替え</button>
<div class="editor-fields"><label for="comment-edit">この局面のコメント</label><textarea id="comment-edit" rows="3" maxlength="50000"></textarea><button id="apply-comment">コメントを反映</button></div>
<details id="info-edit"><summary>対局情報の編集</summary><div class="info-grid"><label>黒番 <input data-prop="PB" maxlength="200"></label><label>白番 <input data-prop="PW" maxlength="200"></label><label>対局名 <input data-prop="GN" maxlength="200"></label><label>大会 <input data-prop="EV" maxlength="200"></label><label>日付 <input data-prop="DT" maxlength="80"></label><label>結果 <input data-prop="RE" maxlength="80"></label><label>コミ（白への加点） <input data-prop="KM" type="number" step="0.5"></label><label>ルール名 <input data-prop="RU" maxlength="80"></label></div><button id="apply-info">対局情報を反映</button></details></details></section>
<p id="message" role="status" aria-live="polite">編集モードです。交点をクリック／タップすると打てます。</p>
<section id="comment-area" hidden><h2>コメント</h2><div id="comment"></div></section>
</section>
<aside class="files-panel"><h2>棋譜の読み書き</h2><p class="muted">SGF形式・4～19路に対応</p><div class="file-buttons"><button id="open" class="primary" title="端末に保存したSGFファイルを読み込みます">SGFファイルを開く</button><button id="save" title="変化・コメントも含めUTF-8のSGFで保存します">棋譜全体を保存</button><input id="file" type="file" accept=".sgf,.ngf,.ugf,.ugi,.gib,.mgt,application/x-go-sgf" hidden></div>
<label class="text-label" for="sgf">SGFテキスト</label><textarea id="sgf" rows="7" spellcheck="false" placeholder="(;GM[1]FF[4]SZ[19]KM[0];B[pd];W[dd])"></textarea><div class="text-actions"><button id="import-text" title="テキスト欄のSGFで現在の棋譜を置き換えます">テキスト欄から読込み</button><button id="export-text" title="現在の棋譜をテキスト欄へ書き出します">碁盤からテキスト欄へ</button></div>
<details id="game-info"><summary>対局情報</summary><dl id="metadata"></dl></details>
<details class="help"><summary>このGo棋譜Studioについて</summary><button type="button" id="about-open">このGo棋譜Studioについて</button></details>
</aside></div>
<footer><a href="licenses.html?v=121" target="_blank" rel="noopener">著作権・ライセンス</a></footer>
</main><dialog id="conflict" aria-labelledby="conflict-title"><h2 id="conflict-title">挿入後の着手を確認</h2><p id="conflict-text"></p><form method="dialog"><button value="force">そのまま石を打つ</button><button value="cut">この手以降を削除</button><button value="cancel">移動をやめる</button></form></dialog><template id="score-template"><div data-score-head><link rel="stylesheet" href="layout60.css?v=121"><link rel="stylesheet" href="ui-policy.css?v=121"><link rel="stylesheet" href="fields.css?v=124"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地合い計算</title><style>body{margin:12px;background:whitesmoke;color:#111;font:14px/1.5 system-ui,sans-serif}h1{font-size:18px;margin:0}.score-window-heading{display:flex;align-items:center;justify-content:space-between}p{margin:8px 0}button,input{font:inherit}button{padding:5px 10px;margin:3px}input[type=number]{box-sizing:content-box;width:6ch;padding:2px;height:16px;min-height:16px;font:12px/16px Arial,sans-serif;appearance:textfield}input[type=number]::-webkit-inner-spin-button{appearance:none}@media(pointer:coarse),(max-width:650px){input[type=number]{padding:4px;height:32px;font:16px/24px Arial,sans-serif}}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}#operation-message{background:#fff0b3;color:#493b0e;font-size:larger;padding:4px 8px;border-radius:4px}.seki-choice{display:inline-block;background:#d7eef8;color:#163f52;padding:6px 9px;border-radius:4px}#result{background:white;border:1px solid #999;padding:8px;font-weight:bold}#formulas{white-space:pre-line}.close-row{text-align:center;margin-top:15px}#problem{color:#a21}.white-square{display:inline-block;width:10px;height:10px;border:1px solid #555;background:white}</style></div><div data-score-body>
<div class="score-window-heading"><h1>地合い計算</h1><button id="close">閉じる</button></div><p>元の碁盤の死に石をクリックすると、一団を除いて再計算します。もう一度クリックすると戻ります。</p><div class="row"><label>コミ <input id="komi" type="number" step="0.5">目</label><span id="operation-message">死に石を指定してください</span></div><p id="heading"></p><p id="formulas"></p><div id="result" role="status"></div><p id="problem"></p><button id="rule">中国ルール</button><button id="reset">再計算</button><p>■黒地　<span class="white-square"></span>白地　赤点：ダメ・未確定　青い輪：指定したセキ<br>死に石の指定は元の棋譜を変更しません。</p><p><strong>計算条件・アゲハマとセキ</strong></p><p>死活は自動判定しません。ダメ詰め・手入れを終え、死に石とセキを指定してください。</p><p>日本ルール：地 − 相手に取られた石（指定した死に石を含む）。中国ルール：活き石 ＋ 囲んだ空点。白にコミを加えます。</p><p><label class="seki-choice"><input id="seki-mode" type="checkbox"> セキの石を指定する</label></p><p>セキは関係する両色の一団を指定してください。日本ルールではその一団に接する空点を地から除外します。中国ルールでは片方だけに囲まれた空点を数えます。</p><div class="row"><label>黒が取った石 <input id="capturedB" type="number" min="0" step="1"></label><label>白が取った石 <input id="capturedW" type="number" min="0" step="1"></label></div><p>途中図・編集した盤面ではアゲハマを確認してください。</p><label>中国ルールの置石補正（白に加算） <input id="adjust" type="number" min="0" step="1" value="0"></label></div></template></body></html>
