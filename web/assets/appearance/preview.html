<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Go棋譜Studio 独自素材プレビュー</title><style>body{font:16px system-ui,sans-serif;margin:24px;background:#edf3f0;color:#203a34}h1{font-size:24px}section{display:flex;flex-wrap:wrap;gap:20px}.card{padding:16px;border:1px solid #aabcb6;border-radius:8px;background:white}.board{width:260px;height:260px;position:relative;border:1px solid #777;background-size:cover}.grid{position:absolute;inset:18px;background-image:linear-gradient(to right,#4f4a3c 1px,transparent 1px),linear-gradient(to bottom,#4f4a3c 1px,transparent 1px);background-size:28px 28px;border-right:1px solid #4f4a3c;border-bottom:1px solid #4f4a3c}.stone{position:absolute;width:25px;height:25px;border-radius:50%;background:radial-gradient(circle at 32% 25%,#555,#101414 75%);box-shadow:1px 2px 3px #0005}.white{background:radial-gradient(circle at 32% 25%,white,#d5dedb 85%)}audio{display:block;margin-top:8px;max-width:100%}</style><h1>Go棋譜Studio 独自素材プレビュー</h1><p>組込み前の試作品です。LizzieYzyの素材は使用していません。</p><h2>テーマ</h2><section id="themes"></section><h2>石音</h2><p>低い音量で試聴してください。いずれも録音ではなく合成音です。</p><section id="sounds"></section><script>
for(const [id,name] of [['warm','木肌 / Warm wood'],['paper','白灰 / Paper'],['night','夜 / Night']]){let c=document.createElement('div');c.className='card';c.innerHTML=`<h3>${name}</h3><div class="board" style="background-image:url(board-${id}.svg)"><div class="grid"></div><i class="stone" style="left:62px;top:62px"></i><i class="stone white" style="left:174px;top:174px"></i><i class="stone" style="left:146px;top:90px"></i></div>`;document.querySelector('#themes').append(c)}
for(const [id,name] of [['soft','柔らかい音'],['clear','明瞭な音'],['low','低めの音']]){let c=document.createElement('div');c.className='card';c.innerHTML=`<strong>${name}</strong><audio controls preload="none" src="stone-${id}.wav"></audio>`;c.querySelector('audio').volume=.25;document.querySelector('#sounds').append(c)}
</script></html>
