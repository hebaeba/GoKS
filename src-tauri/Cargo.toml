[package]
name = "kifu-editor"
version = "0.8.0-preview.2"
description = "Standalone Go record editor"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }

serde_json = "1"
kifu-katago-backend = { path = "../backend-rs" }
kifu-lan-server = { path = "../lan-server" }
[target.'cfg(windows)'.dependencies]
rfd = "0.15"
[features]
custom-protocol = ["tauri/custom-protocol"]
